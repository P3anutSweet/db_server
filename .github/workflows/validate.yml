name: Validate server setup
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate Bash syntax and lint
        run: |
          bash -n scripts/bootstrap-ubuntu.sh
          shellcheck scripts/bootstrap-ubuntu.sh
          bash scripts/bootstrap-ubuntu.sh --help
      - name: Reject invalid input without changing the runner
        run: |
          if bash scripts/bootstrap-ubuntu.sh --user root --client-ip 192.168.1.2; then exit 1; fi
          if bash scripts/bootstrap-ubuntu.sh --user test --client-ip 999.1.1.1; then exit 1; fi
          if bash scripts/bootstrap-ubuntu.sh --user; then exit 1; fi
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/connect.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
  storage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate storage and backup programs
        run: |
          python3 -m py_compile scripts/*.py tools/schema/*.py
          python3 scripts/setup-storage.py --help
          python3 scripts/deploy-teable.py
          python3 -m unittest discover -s tests -v
          systemd-analyze calendar '*-*-* 03:00:00 Asia/Shanghai'
      - name: Validate isolated Compose configuration
        run: python3 scripts/validate-teable-compose.py
      - name: Validate transactional change capture and crash-safe export
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          python3 tests/validate_record_change_sql.py \
            --pg-bin /usr/lib/postgresql/16/bin \
            --share-dir /usr/share/postgresql/16 \
            --work "$(mktemp -d "$RUNNER_TEMP/db-record-changes.XXXXXX")" \
            --program "$PWD/scripts/record-change-backup.py"
      - name: Validate review-only schema and generated field dictionary
        run: |
          python3 tools/schema/build_design.py
          python3 tools/schema/build_model_v2.py
          git diff --exit-code -- schema/teable-design.json docs/database-design/FIELD_DICTIONARY.md schema/teable-model-v2.json docs/database-design/V2_FIELD_DICTIONARY.md
