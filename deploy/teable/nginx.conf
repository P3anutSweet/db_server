# Host proxy: Docker is published on loopback so UFW still filters LAN access.
map $http_upgrade $teable_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 192.168.32.84:80;
    server_name 192.168.32.84;
    allow 127.0.0.1;
    allow 192.168.32.0/24;
    deny all;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $teable_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
